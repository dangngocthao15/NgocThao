<!DOCTYPE html>
<html lang="vi">
	<head>
		<title>THIẾT KẾ TRANG GIỚI THIỆU THÔNG TIN SẢN PHẨM</title>
		<meta charset="utf-8">
       <!-- Latest compiled and minified CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Latest compiled JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		
    </head>
	<body>
		<div class = "container">
            <div id = "product-list">
                <!--Chứa danh sách các sản phẩm-->

            </div>

        </div>
        <script>
            // xác định khung chúa product-List
            const listProducts = document.getElementById("product-list");// tác động đến thẻ div có id ="product_List"
            // tạo 1 container có las "item"
            const item = document.createElement("div");//<div><div>
            item.setAttribute("class","item card-img-top");
            // tạo 2 khung chứa hình ảnh và thông tin
            // tạo 1 container chứa hình ảnh có class ="image"==> chỉ có 1 con là <img>
            const containerImage = document.createElement("div");
            containerImage.setAttribute("class","image");
            // tạo ảnh
            const img = document.createElement("img");
            img.setAttribute("src","../assets/images/ao ba om.jpg");
            img.setAttribute("alt","AO BA OM");
            img.setAttribute("style","width:100%;max-width:150px");
           // đưua vào khung ảnh
            containerImage.appendChild(img);
            // tạo 1 cái container chứa thông tin các sản phẩm
            const containerInfo =document.createElement("div");
            containerInfo.setAttribute("class","info card-body");
            // tạo p chứa tên sản phẩm
            const nameProduct = document.createElement("h2");
            nameProduct.innerHTML="Ao BA OM ";
            nameProduct.setAttribute("class","card-title text-danger")
            // giá
            const price = document.createElement("p");
            price.innerHTML="250k/1 chuyến đi ";
            // mô tả
            const description = document.createElement("p")
            description.innerHTML= "Là nơi mát nhất ở Trà Vinh";
            // liên kết
            const linkProduct = document.createElement("a");
            linkProduct.innerHTML="xem chi tiết";
            linkProduct.setAttribute("href","page7.html");
            linkProduct.setAttribute("class","btn btn-info")
            // gắn 4 con vào khung chứa
            containerInfo.appendChild(nameProduct);
            containerInfo.appendChild(price);
            containerInfo.appendChild(description);
            containerInfo.appendChild(linkProduct);
            // thêm vào khung chứa
            item.appendChild(containerImage);
            item.appendChild(containerInfo);
            // thêm vào list
           listProducts.appendChild(item);
         


        </script>
	</body>
</html>
